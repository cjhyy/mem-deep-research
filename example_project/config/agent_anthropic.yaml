# Anthropic direct API config
# Requires ANTHROPIC_API_KEY

main_agent:
  prompt:
    agent_type: main
    tool_format: xml
    presets: [task_completion]

  llm:
    provider_class: "ClaudeAnthropicClient"
    model_name: "claude-sonnet-4-20250514"
    async_client: true
    temperature: 0.3
    max_tokens: 32000
    timeout: 300
    retry_max_attempts: 3
    retry_strategy: "exponential"
    retry_multiplier: 2
    retry_wait_seconds: 5
    anthropic_api_key: "${oc.env:ANTHROPIC_API_KEY}"
    enable_streaming: true
    keep_tool_result: 5

  tool_config:
    - tool-calculator
    # - tool-searching-serper

  execution_mode: auto
  max_turns: 30
  max_tool_calls_per_turn: 10
  max_concurrent_subagents: 3
  response_language: auto

  todo_tracker:
    enabled: true

  task_engine:
    enabled: true
    reflection_interval: 5

  skill_selection:
    enabled: true
    method: inline
    max_skills: 3

  context_manager:
    enable_dedup: true
    enable_compact: true
    compact_at_ratio: 0.6
    summarize_at_ratio: 0.8
    result_offload_threshold: 5000

  monitoring:
    enable_loop_detection: true
    max_total_time: 1800.0

  interceptor:
    preset: default

  add_message_id: true

output_dir: logs/
