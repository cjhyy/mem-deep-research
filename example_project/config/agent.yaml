# Universal Agent Configuration
#
# Handles everything: quick greetings, calculations, web research, deep analysis.
# The framework auto-selects execution mode based on task complexity.
#
# Usage:
#   python run.py "你好"                          → quick: 快速回答(≤3轮)
#   python run.py "123 * 456"                     → standard: 用计算器
#   python run.py "研究量子计算的最新进展" --deep   → deep: 多轮执行 + 反思

main_agent:
  prompt:
    agent_type: main
    tool_format: xml
    presets: [task_completion]

  llm:
    provider_class: "ClaudeOpenRouterClient"
    model_name: "anthropic/claude-sonnet-4.6"
    async_client: true
    temperature: 0.3
    top_p: 1.0
    min_p: 0.0
    top_k: -1
    max_tokens: 32000
    timeout: 300
    retry_max_attempts: 3
    retry_strategy: "exponential"
    retry_multiplier: 2
    retry_wait_seconds: 5
    openrouter_api_key: "${oc.env:OPENROUTER_API_KEY}"
    openrouter_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
    openrouter_provider: ""
    enable_streaming: true
    disable_cache_control: false
    keep_tool_result: 5
    oai_tool_thinking: false

  # Tools — framework auto-provides spawn_agent + update_todo as built-in tools
  tool_config:
    - tool-calculator
    - tool-filesystem
    - tool-searching-serper

  keep_tool_result: -1             # -1 全部保留

  # Execution
  execution_mode: auto             # auto | quick | standard | deep
  max_turns: 30                    # 足够长程任务
  max_tool_calls_per_turn: 10
  max_concurrent_subagents: 3      # 并行子 agent 限制

  # Processing
  input_process:
    hint_generation: false
  output_process:
    final_answer_extraction: false

  # Language
  response_language: auto          # auto-detect from query

  # Task tracking — agent manages its own todo list for complex tasks
  todo_tracker:
    enabled: true

  # Deep research — reflection checkpoints for long tasks
  task_engine:
    enabled: false                   # true 时强制 deep 模式，false 时 auto 由 LLM 判断
    reflection_interval: 5
    auto_planning: false           # LLM 自主决定是否分解任务

  # Skill system — progressive loading saves tokens
  skill_selection:
    enabled: true
    method: inline
    max_skills: 3
    progressive: true              # 只在需要时加载完整 skill

  # Context management — keeps context lean for long tasks
  context_manager:
    enable_dedup: true
    enable_compact: true
    compact_at_ratio: 0.6
    summarize_at_ratio: 0.8
    compact_keep_recent: 3
    result_offload_threshold: 5000  # 大结果卸载到文件（默认 0 = 关闭；需要 output_dir 可写）

  # Monitoring — prevents infinite loops
  monitoring:
    enable_loop_detection: true
    loop_escalation_terminate_threshold: 3
    max_total_time: 1800.0         # 30 分钟上限
    max_consecutive_empty_turns: 3

  interceptor:
    preset: default

  add_message_id: true

output_dir: logs/
