# Example Agent Configuration
# Works out of the box with an OpenRouter API key
#
# Usage:
#   python run.py "your task" --config agent

main_agent:
  prompt:
    agent_type: main
    tool_format: xml
    presets: [research]
    # templates_dir: config/prompts          # 取消注释以使用项目级模板
    # custom_system_template: custom_system  # 取消注释以使用自定义 system prompt

  llm:
    provider_class: "ClaudeOpenRouterClient"
    model_name: "anthropic/claude-sonnet-4"
    async_client: true
    temperature: 0.3
    top_p: 0.95
    min_p: 0.0
    top_k: -1
    max_tokens: 32000
    timeout: 300
    retry_max_attempts: 3
    retry_strategy: "exponential"
    retry_multiplier: 2
    retry_wait_seconds: 5
    openrouter_api_key: "${oc.env:OPENROUTER_API_KEY}"
    openrouter_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
    openrouter_provider: ""
    enable_streaming: true
    disable_cache_control: false
    keep_tool_result: 5
    oai_tool_thinking: false

  # Tools — add tool-searching-serper if you have SERPER_API_KEY
  tool_config:
    - tool-calculator
    # - tool-searching-serper  # Uncomment and set SERPER_API_KEY in .env

  max_turns: 10
  max_tool_calls_per_turn: 5

  deep_research:
    enabled: true
    reflection_interval: 5

  # Skill selection — inject relevant skills into system prompt
  skill_selection:
    enabled: true
    method: inline           # rules | llm | inline
    max_skills: 3

  # Context management — auto-compress when context grows large
  context_manager:
    enable_dedup: true
    enable_compact: true
    compact_at_ratio: 0.6
    summarize_at_ratio: 0.8
    compact_keep_recent: 3

  # Monitoring — loop detection & timeout
  monitoring:
    enable_loop_detection: true
    loop_escalation_terminate_threshold: 3
    max_total_time: 600.0
    max_consecutive_empty_turns: 3

  # Interceptor — controls SSE streaming output
  interceptor:
    preset: default          # default | verbose | minimal | debug

  add_message_id: true
  response_language: auto        # auto | Chinese | English | Japanese | ...
  chinese_context: false

sub_agents: null

output_dir: logs/
