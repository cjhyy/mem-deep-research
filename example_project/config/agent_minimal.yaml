# Minimal config — quick testing with calculator only
# No deep research, no task tracking, 5 turns max

main_agent:
  llm:
    provider_class: "ClaudeOpenRouterClient"
    model_name: "anthropic/claude-sonnet-4"
    temperature: 0.3
    max_tokens: 16000
    openrouter_api_key: "${oc.env:OPENROUTER_API_KEY}"
    keep_tool_result: 3

  tool_config:
    - tool-calculator

  execution_mode: auto
  max_turns: 5
  max_tool_calls_per_turn: 3
  response_language: auto

output_dir: logs/
